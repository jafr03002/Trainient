<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch and home indicator;
         the shell pads itself with env(safe-area-inset-*). No maximum-scale:
         pinch-zoom must keep working. The theme-color meta and manifest link
         are injected at build from src/theme/tokens.ts (vite.config.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS only: Safari zooms the page in whenever an input under 16px gets
         focus (every Clerk field, most set-logging inputs) and leaves it zoomed.
         maximum-scale=1 stops that, and since iOS 10 Safari ignores it for
         pinch-zoom, so pinching still works. Android honours maximum-scale for
         pinch too, and never auto-zooms, so it keeps the plain viewport. -->
    <script>
      (function () {
        var ua = navigator.userAgent;
        var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!iOS) return;
        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute("content", viewport.getAttribute("content") + ", maximum-scale=1");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trainient" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Trainient | Train With Intent</title>
    <meta name="description" content="Trainient - train with intent. AI coaching and manual training tools for serious lifters." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Trainient" />
    <meta property="og:description" content="Trainient - train with intent. AI coaching and manual training tools for serious lifters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trainient" />
    <meta name="twitter:description" content="Trainient - train with intent. AI coaching and manual training tools for serious lifters." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Splash screen. Inline so it paints before the JS bundle loads; main.tsx
         removes it via src/lib/splash.ts. Hard-coded black because the theme
         tokens live in the bundle's CSS, which hasn't arrived yet. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #000; color: #f5f5f7; font-family: Inter, system-ui, -apple-system, sans-serif; transition: opacity .35s ease; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash .splash-word { position: relative; font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: .3em; padding-left: .3em; opacity: 0; animation: splash-word 1s cubic-bezier(.2,.8,.2,1) .1s forwards; }
      #splash .splash-i { position: relative; display: inline-block; }
      #splash .splash-dot { position: absolute; left: 50%; top: .06em; width: .42em; height: .42em; transform: translate(-50%, -50%) scale(0) rotate(-120deg); animation: splash-dot .8s cubic-bezier(.3,1.4,.4,1) .85s forwards; }
      #splash .splash-bar { position: absolute; bottom: calc(48px + env(safe-area-inset-bottom)); left: 50%; width: 88px; height: 2px; margin-left: -44px; border-radius: 2px; background: #161618; overflow: hidden; }
      #splash .splash-bar i { display: block; height: 100%; width: 0; background: #f5f5f7; animation: splash-bar 1.8s ease .2s forwards; }
      @keyframes splash-word { to { opacity: 1; letter-spacing: -.02em; padding-left: 0; } }
      @keyframes splash-dot { to { transform: translate(-50%, -50%) scale(1) rotate(0); } }
      @keyframes splash-bar { to { width: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation-duration: .01s !important; animation-delay: 0s !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-word"><span class="splash-i">ı<img class="splash-dot" src="/intent-sun.png" alt="" /></span>ntent</div>
      <div class="splash-bar"><i></i></div>
    </div>
    <script>
      // Once per browser session: a reload or in-app refresh skips straight to the app.
      try {
        if (sessionStorage.getItem("intent-splash-seen")) document.getElementById("splash").remove();
        else sessionStorage.setItem("intent-splash-seen", "1");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

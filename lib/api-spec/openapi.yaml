openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trainient AI Gym Coaching API
servers:
  - url: /api
    description: Base API path
# Every route requires a signed-in Clerk user unless it overrides this with
# `security: []` (only /healthz and the Stripe webhook do). Either scheme works:
# the web app rides Clerk's same-origin session cookie, and a native client
# sends the session token as a Bearer header (see custom-fetch.ts's
# setAuthTokenGetter). A request with neither gets 401 { error: "Unauthorized" }.
security:
  - clerkBearer: []
  - clerkSessionCookie: []
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and onboarding
  - name: programs
    description: Training programs
  - name: workouts
    description: Workout logging
  - name: checkins
    description: Weekly check-ins
  - name: calibration
    description: The calibration review - the readiness check that ends calibration
  - name: progress
    description: Progress analytics
  - name: bodyweight
    description: Daily bodyweight logging
  - name: subscriptions
    description: Stripe subscription management
  - name: calendar
    description: Calendar colours

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Profile ──────────────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
    post:
      operationId: createProfile
      tags: [profile]
      summary: Create or upsert user profile (called at end of onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /account:
    delete:
      operationId: deleteAccount
      tags: [profile]
      summary: Permanently delete the current user's account data
      description: >
        Deletes every row this user owns across all tables. Callers are
        expected to delete the Clerk user afterwards - this endpoint only
        clears application data, and does so first so a failure leaves the
        account still signed-in-able rather than stranding orphaned rows.
      responses:
        "204":
          description: Deleted

  # ── Programs ─────────────────────────────────────────────────────────────────
  /programs/current:
    get:
      operationId: getCurrentProgram
      tags: [programs]
      summary: Get the user's current active program within their active mode's program lineage (Independent vs. AI)
      parameters:
        - name: lineage
          in: query
          required: false
          description: Resolve "current" within this explicit lineage instead of the caller's active mode - lets either mode's program page view its own lineage without switching modes.
          schema:
            type: string
            enum: [ai, manual]
      responses:
        "200":
          description: Current program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: No active program

  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List all programs for the user
      responses:
        "200":
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createManualProgram
      tags: [programs]
      summary: Create a manual (non-AI) program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/generate:
    post:
      operationId: generateProgram
      tags: [programs]
      summary: Trigger AI generation of a new program based on user profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProgramInput"
      responses:
        "201":
          description: Program generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  # Resumable variant of POST /programs/generate for clients that can't hold a
  # request open for a minute (the native app): 202 straight away, then poll.
  /programs/generate/jobs:
    post:
      operationId: startProgramGenerationJob
      tags: [programs]
      summary: Start AI program generation as a background job
      description: >
        Same input and the same 400s as POST /programs/generate, answered
        immediately. Otherwise returns 202 with a job id to poll. If the caller
        already has an unfinished generation job, that job's id is returned
        instead of starting a second one.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProgramInput"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobAccepted"
        "400":
          description: Invalid input, or onboarding not complete

  /programs/generate/jobs/{jobId}:
    get:
      operationId: getProgramGenerationJob
      tags: [programs]
      summary: Poll a program generation job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state; `result` is the generated Program once status is succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramGenerationJob"
        "404":
          description: No such job for this user

  /programs/:id:
    put:
      operationId: updateProgram
      tags: [programs]
      summary: Update a manual (non-AI) program (add/edit days and exercises); AI-generated programs cannot be edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualProgramInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/{id}:
    patch:
      operationId: setProgramStartDate
      tags: [programs]
      summary: Set the user-chosen start date for a program (AI or manual)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramStartDateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Program not found

  # ── Workouts ─────────────────────────────────────────────────────────────────
  /workouts:
    get:
      operationId: listWorkouts
      tags: [workouts]
      summary: List workout logs for the user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of workout logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutLog"
    post:
      operationId: createWorkout
      tags: [workouts]
      summary: Save a completed workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLog"

  /workouts/recent:
    get:
      operationId: getRecentWorkouts
      tags: [workouts]
      summary: Get the 3 most recent workout logs (dashboard use)
      responses:
        "200":
          description: Recent workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutLog"

  /workouts/stats:
    get:
      operationId: getWorkoutStats
      tags: [workouts]
      summary: Quick stats for the dashboard (current week, total logged, streak)
      responses:
        "200":
          description: Workout stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutStats"

  /workouts/duration-stats:
    get:
      operationId: getSessionDurationStats
      tags: [workouts]
      summary: Average session duration per session type, over sessions eligible to be averaged
      responses:
        "200":
          description: Average duration per day label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDurationStats"

  /workouts/by-day-label:
    get:
      operationId: getWorkoutsByDayLabel
      tags: [workouts]
      summary: Get all workouts for a specific day label (for session review comparison)
      parameters:
        - name: label
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workouts for this day label
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutLog"

  /workouts/{id}:
    delete:
      operationId: deleteWorkout
      tags: [workouts]
      summary: Delete a logged workout session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Check-ins ─────────────────────────────────────────────────────────────────
  /checkins:
    get:
      operationId: listCheckins
      tags: [checkins]
      summary: List all check-ins for the user
      responses:
        "200":
          description: Check-ins list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkin"
    post:
      operationId: submitCheckin
      tags: [checkins]
      summary: Submit weekly check-in and trigger AI program adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "201":
          description: Check-in submitted and AI adjustment generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinResult"

  /checkins/latest:
    get:
      operationId: getLatestCheckin
      tags: [checkins]
      summary: Get the most recent check-in (to decide if banner should show)
      responses:
        "200":
          description: Latest check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkin"
        "404":
          description: No check-ins yet

  /checkins/adherence:
    get:
      operationId: getCheckinAdherence
      tags: [checkins]
      summary: Sessions logged vs planned this week, for the check-in form
      responses:
        "200":
          description: Session adherence for the current 7-day window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAdherence"
        "404":
          description: No AI-generated program to measure against

  # Resumable variant of POST /checkins - see /programs/generate/jobs.
  /checkins/jobs:
    post:
      operationId: startCheckinJob
      tags: [checkins]
      summary: Submit a weekly check-in and run the AI adjustment as a background job
      description: >
        Same input and the same 400s as POST /checkins, answered immediately.
        Otherwise returns 202 with a job id to poll. The check-in is recorded by
        the job, just before the AI call. If the caller already has an
        unfinished check-in job, that job's id is returned instead of recording
        a second check-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobAccepted"
        "400":
          description: Invalid input, or no AI program to adjust

  /checkins/jobs/{jobId}:
    get:
      operationId: getCheckinJob
      tags: [checkins]
      summary: Poll a check-in job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state; `result` is the CheckinResult once status is succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinJob"
        "404":
          description: No such job for this user

  # ── Calibration review ────────────────────────────────────────────────────────
  # The readiness check that ends calibration. Not a weekly check-in (those stay
  # closed until 7 days after it). Day 1 is the program's start date; the review
  # opens on day 8 and the last day to take it is day 21. A client who hasn't
  # passed by then leaves calibration on day 22 through POST /calibration/exit.
  /calibration/status:
    get:
      operationId: getCalibrationStatus
      tags: [calibration]
      summary: Where the client is in calibration, the hard checks, and their session feedback so far
      responses:
        "200":
          description: Calibration status. `inCalibration` is false outside calibration and every other field is then empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationStatus"

  /calibration/reviews:
    post:
      operationId: submitCalibrationReview
      tags: [calibration]
      summary: Submit the calibration review and get the verdict (blocking)
      description: >
        illOrInjured=true pauses calibration with no AI call. Otherwise the AI
        judges readiness. A failed hard check (rotation, weigh-ins, nutrition
        logs) still records the answers, but the verdict is always extend. On
        pass the next phase's program is written, with exercise swaps applied.
        400 when the review isn't open (before day 8, after the last review
        day, paused, already extended today, or not in calibration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationReviewInput"
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationReviewResult"
        "400":
          description: Invalid input, or the review isn't open

  /calibration/reviews/jobs:
    post:
      operationId: startCalibrationReviewJob
      tags: [calibration]
      summary: Submit the calibration review and run the AI judgement as a background job
      description: Same input and the same 400s as POST /calibration/reviews, answered immediately. Otherwise 202 with a job id to poll at GET /calibration/jobs/{jobId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationReviewInput"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobAccepted"
        "400":
          description: Invalid input, or the review isn't open

  /calibration/exit:
    post:
      operationId: finishCalibration
      tags: [calibration]
      summary: End calibration automatically once the last review day has passed (blocking)
      description: >
        Only allowed when GET /calibration/status reports autoExitDue (day 22 or
        later, not paused). The AI writes a summary from the session notes, logs
        and the last review. The client moves into the next phase with any
        exercise swaps applied. The verdict is always pass_with_notes.
      responses:
        "201":
          description: Calibration ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationReviewResult"
        "400":
          description: Calibration isn't due to end yet

  /calibration/exit/jobs:
    post:
      operationId: startCalibrationExitJob
      tags: [calibration]
      summary: End calibration automatically, as a background job
      description: Same 400s as POST /calibration/exit. Otherwise 202 with a job id to poll at GET /calibration/jobs/{jobId}.
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobAccepted"
        "400":
          description: Calibration isn't due to end yet

  /calibration/jobs/{jobId}:
    get:
      operationId: getCalibrationJob
      tags: [calibration]
      summary: Poll a calibration review or exit job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state; `result` is the CalibrationReviewResult once status is succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationJob"
        "404":
          description: No such job for this user

  /calibration/recovered:
    post:
      operationId: resumeCalibration
      tags: [calibration]
      summary: End a pause - the client has recovered from illness or injury
      description: Opens a fresh window. The review can be taken straight away, and the automatic exit moves to 7 days after today at the earliest.
      responses:
        "200":
          description: Updated calibration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationStatus"
        "400":
          description: Calibration isn't paused

  # ── Progress ──────────────────────────────────────────────────────────────────
  /progress/volume:
    get:
      operationId: getVolumeProgress
      tags: [progress]
      summary: Weekly total volume over time (for line chart)
      responses:
        "200":
          description: Volume data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumePoint"

  /progress/strength:
    get:
      operationId: getStrengthProgress
      tags: [progress]
      summary: Max weight per exercise over time
      parameters:
        - name: exercise
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Strength data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrengthPoint"

  /progress/prs:
    get:
      operationId: getPersonalRecords
      tags: [progress]
      summary: All-time personal records per exercise
      responses:
        "200":
          description: Personal records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalRecord"

  /progress/muscle-volume:
    get:
      operationId: getMuscleVolumeBreakdown
      tags: [progress]
      summary: Weekly sets per muscle group (stacked bar chart data)
      responses:
        "200":
          description: Muscle volume breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MuscleVolumeWeek"

  /progress/exercises:
    get:
      operationId: listTrackedExercises
      tags: [progress]
      summary: List all exercises the user has logged (for the strength chart dropdown)
      responses:
        "200":
          description: Exercise names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ── Bodyweight ────────────────────────────────────────────────────────────────
  /bodyweight:
    post:
      operationId: logBodyweight
      tags: [bodyweight]
      summary: Log (upsert) the bodyweight entry for a given date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyweightLogInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyweightLog"

  /bodyweight/today:
    get:
      operationId: getTodaysBodyweight
      tags: [bodyweight]
      summary: Get the bodyweight entry for a given date, if logged (drives the dashboard card's state)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry for that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyweightLog"
        "404":
          description: Not logged yet

  /progress/bodyweight:
    get:
      operationId: getBodyweightProgress
      tags: [progress]
      summary: Bodyweight over time (for line chart)
      responses:
        "200":
          description: Bodyweight data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyweightPoint"

  /progress/goal:
    get:
      operationId: getGoalProgress
      tags: [progress]
      summary: Trend weight vs. goal weight, with a 14-day trailing-rate projected target date
      responses:
        "200":
          description: Goal progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalProgress"

  # ── Daily logs (calories / steps / cardio) ──────────────────────────────────
  /daily-checkin:
    post:
      operationId: submitDailyCheckin
      tags: [dailyLogs]
      summary: Log (upsert) today's calories/steps/cardio, and optionally bodyweight, in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyCheckinInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCheckinResult"

  /daily-logs/week:
    get:
      operationId: getDailyLogsWeek
      tags: [dailyLogs]
      summary: Get a 7-day window of daily logs (calories/steps/cardio/weight) plus this week's phase
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 7 days of merged daily-log data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogsWeekResult"

  # ── Calendar colours ──────────────────────────────────────────────────────────
  /calendar/colors:
    get:
      operationId: getCalendarColors
      tags: [calendar]
      summary: Get all calendar day-label colour mappings for the user
      responses:
        "200":
          description: Colour mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarColor"
    post:
      operationId: upsertCalendarColor
      tags: [calendar]
      summary: Save or update a colour for a day label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarColorInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarColor"

  # ── Subscriptions ─────────────────────────────────────────────────────────────
  /subscriptions/current:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get current subscription status
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/checkout:
    post:
      operationId: createCheckoutSession
      tags: [subscriptions]
      summary: Create a Stripe checkout session for Pro plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /subscriptions/portal:
    post:
      operationId: createPortalSession
      tags: [subscriptions]
      summary: Create a Stripe customer portal session
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"

  /subscriptions/webhook:
    post:
      operationId: stripeWebhook
      tags: [subscriptions]
      summary: Stripe webhook endpoint
      description: >
        Called by Stripe, not by the app. Unauthenticated by Clerk: the request
        is instead verified against the `Stripe-Signature` header using
        STRIPE_WEBHOOK_SECRET, and refused (500) if that secret is not configured.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token (what a native client sends).
    clerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk's same-origin session cookie (what the web app sends).

  # ⚠ UNKNOWN FIELDS ARE SILENTLY DROPPED. Orval turns every schema below into a
  # plain zod.object() - no .strict(), no .passthrough() - and zod's default is
  # to strip keys it doesn't know. Routes safeParse the body and then spread
  # `...parsed.data` into the insert (e.g. workouts.ts, checkinSubmission.ts),
  # so a field a client sends that is missing here never reaches the database:
  # no 400, no log line, the column just stays null. Nested objects strip too:
  # a new per-set field in WorkoutLogInput.exercisesLogged[].sets[] vanishes
  # from the JSONB the same way (LoggedExercise.notes was lost like this).
  # Adding a field to a request means adding it HERE first and re-running
  # codegen, in the same change as the client that sends it.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Profile ────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [userId, mode, goal, experience, trainingDays, equipment, priorityMuscles, onboardingComplete, createdAt]
      properties:
        userId:                 { type: string }
        name:                   { type: ["string", "null"] }
        mode:                   { type: string }
        goal:                   { type: string }
        experience:             { type: string }
        trainingDays:           { type: integer }
        equipment:              { type: array, items: { type: string } }
        age:                    { type: ["integer", "null"] }
        sex:                    { type: ["string", "null"] }
        weight:                 { type: ["number", "null"] }
        weightUnit:             { type: ["string", "null"] }
        goalWeight:             { type: ["number", "null"] }
        activityLevel:          { type: ["string", "null"] }
        preferredRestDays:      { type: array, items: { type: string } }
        injuries:               { type: ["string", "null"] }
        injurySeverity:         { type: ["string", "null"], enum: [low, medium, high, null] }
        priorityMuscles:        { type: array, items: { type: string } }
        dailyCalorieTarget:     { type: ["integer", "null"] }
        dailyStepTarget:        { type: ["integer", "null"] }
        cardioDays:             { type: array, items: { type: string } }
        cardioMinutes:          { type: ["integer", "null"] }
        onboardingComplete:     { type: boolean }
        onboardingCompletedAt:  { type: ["string", "null"] }
        calibrationWalkthroughSeenAt: { type: ["string", "null"] }
        calibrationBriefingSeenAt: { type: ["string", "null"] }
        programPageTourSeenAt: { type: ["string", "null"] }
        weightLoggingTourSeenAt: { type: ["string", "null"] }
        dashboardTourSeenAt: { type: ["string", "null"] }
        calendarTourSeenAt: { type: ["string", "null"] }
        createdAt:              { type: string }

    # Ranges below are plausibility guards, not coaching opinions - they exist so a
    # typo or a hostile client can't persist age 999 / weight -50 / a 0 kcal target.
    # Weights are deliberately unit-agnostic (the same column stores kg and lbs, each
    # log carrying its own weightUnit), so the band has to span 20 kg .. 1000 lbs.
    # Only the *Input* schemas are constrained: the response schemas stay open so
    # profiles that already hold out-of-range values from before this guard existed
    # remain readable.
    UserProfileInput:
      type: object
      required: [mode, trainingDays]
      properties:
        name:                   { type: string, maxLength: 80 }
        mode:                   { type: string }
        goal:                   { type: string }
        experience:             { type: string }
        trainingDays:           { type: integer, minimum: 1, maximum: 7 }
        equipment:              { type: array, items: { type: string } }
        age:                    { type: ["integer", "null"], minimum: 13, maximum: 120 }
        sex:                    { type: ["string", "null"] }
        weight:                 { type: ["number", "null"], minimum: 20, maximum: 1000 }
        weightUnit:             { type: ["string", "null"] }
        goalWeight:             { type: ["number", "null"], minimum: 20, maximum: 1000 }
        activityLevel:          { type: ["string", "null"] }
        preferredRestDays:      { type: array, items: { type: string } }
        injuries:               { type: ["string", "null"], maxLength: 1000 }
        injurySeverity:         { type: ["string", "null"], enum: [low, medium, high, null] }
        priorityMuscles:        { type: array, items: { type: string } }
        dailyCalorieTarget:     { type: ["integer", "null"], minimum: 800, maximum: 10000 }
        dailyStepTarget:        { type: ["integer", "null"], minimum: 0, maximum: 100000 }
        cardioDays:             { type: array, items: { type: string } }
        cardioMinutes:          { type: ["integer", "null"], minimum: 0, maximum: 1440 }

    UserProfileUpdate:
      type: object
      properties:
        name:           { type: string, maxLength: 80 }
        mode:           { type: string }
        goal:           { type: string }
        trainingDays:   { type: integer, minimum: 1, maximum: 7 }
        goalWeight:     { type: ["number", "null"], minimum: 20, maximum: 1000 }
        age:            { type: ["integer", "null"], minimum: 13, maximum: 120 }
        weight:         { type: ["number", "null"], minimum: 20, maximum: 1000 }
        weightUnit:     { type: ["string", "null"] }
        injuries:       { type: ["string", "null"], maxLength: 1000 }
        injurySeverity: { type: ["string", "null"], enum: [low, medium, high, null] }
        dailyCalorieTarget:     { type: ["integer", "null"], minimum: 800, maximum: 10000 }
        dailyStepTarget:        { type: ["integer", "null"], minimum: 0, maximum: 100000 }
        cardioDays:             { type: array, items: { type: string } }
        cardioMinutes:          { type: ["integer", "null"], minimum: 0, maximum: 1440 }
        calibrationWalkthroughSeenAt: { type: ["string", "null"] }
        calibrationBriefingSeenAt: { type: ["string", "null"] }
        programPageTourSeenAt: { type: ["string", "null"] }
        weightLoggingTourSeenAt: { type: ["string", "null"] }
        dashboardTourSeenAt: { type: ["string", "null"] }
        calendarTourSeenAt: { type: ["string", "null"] }

    # ── Programs ───────────────────────────────────────────────────────────────
    # The sets/reps ceilings are absurdity backstops (a set count of 99999 is a typo,
    # not a workout), not programming advice - hence the generous 50. Length caps keep
    # a pasted essay out of the exercise row, which has nowhere to put it.
    # A day's items are a mixed list: `kind` discriminates a weight-training row
    # from a checklist row (stretching, a plank hold, breathing work). Checklist
    # rows deliberately reuse the lift fields rather than adding required ones -
    # `sets` is the round count and `reps` is the human-readable target ("2:30") -
    # so every pre-existing row and client keeps validating unchanged. They also
    # carry muscle:"" so the muscle-volume maths skips them.
    #
    # A checklist row never carries weight or reps data when logged, which is what
    # keeps it out of volume/e1RM/PR analysis for free (see workoutAnalysis.ts's
    # isPerformed). Nothing may synthesise fake sets to represent a tick.
    Exercise:
      type: object
      required: [name, sets, reps, muscle]
      properties:
        name:            { type: string, maxLength: 80 }
        sets:            { type: integer, minimum: 1, maximum: 50 }
        reps:            { type: string, maxLength: 50 }
        rpe:             { type: ["integer", "null"] }
        restSeconds:     { type: ["integer", "null"] }
        cue:             { type: ["string", "null"] }
        muscle:          { type: string }
        secondaryMuscle: { type: ["string", "null"] }
        isUnilateral:    { type: boolean }
        # Absent on every row written before checklist items existed, hence the
        # default rather than a required field.
        kind:            { type: string, enum: [lift, checklist], default: lift }
        # How a checklist row is measured. "none" (or null) is a plain tick-off,
        # which is the default a new item starts as - the target fields below are
        # all optional by design, so an item is usable with just a name.
        targetType:      { type: ["string", "null"], enum: [duration, count, distance, none, null] }
        # Duration is stored ONLY as a canonical second count - the builder's
        # min/sec wheel is a view concern. A 5-minute item and a 300-second item are the
        # same row, so nothing downstream ever converts units. 86400 = 24h, an
        # absurdity backstop rather than programming advice.
        targetSeconds:   { type: ["integer", "null"], minimum: 0, maximum: 86400 }
        # Used by targetType count/distance only; duration uses targetSeconds.
        targetValue:     { type: ["number", "null"], minimum: 0, maximum: 100000 }
        targetUnit:      { type: ["string", "null"], enum: [reps, m, km, null] }
        # Drives the item's accent colour. Cardio is deliberately absent:
        # it already lives in daily_logs.cardioMinutes and Program.cardioIntensity,
        # and a third home for it would fragment the data.
        category:        { type: ["string", "null"], enum: [stretch, mobility, core, breathing, other, null] }

    ProgramDay:
      type: object
      required: [dayNumber, label, focus, exercises]
      properties:
        dayNumber:  { type: integer }
        label:      { type: string, maxLength: 60 }
        focus:      { type: string, maxLength: 60 }
        estimatedDurationMinutes:
          type: ["integer", "null"]
          minimum: 1
          maximum: 300
          description: "The AI's predicted wall-clock length for this session, including warm-up and prescribed rest. Null for days the AI never generated (Independent mode), which fall back to an arithmetic estimate client-side."
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    ProgramHighlight:
      type: object
      required: [title, detail]
      properties:
        title:  { type: string }
        detail: { type: string }

    # When each training day is trained. Held beside `days`, not on each day: a
    # per-day weekday cannot express where the REST slots fall in a rotation, nor
    # the same day appearing twice in one cycle.
    #
    # Every non-null slot is a `dayNumber` from the same program's `days`; null is
    # a rest slot.
    #   fixed    - exactly 7 slots, index 0 = Monday .. 6 = Sunday, repeating weekly.
    #   rotating - 2..14 slots, one cycle, repeating from the program's startDate.
    #
    # Only AI generation and the weekly check-in write a schedule, and both only
    # ever produce `fixed`. `rotating` is currently a shape readers must handle
    # (the program page's strip does) rather than one anything produces - it is
    # kept so a stored cycle stays readable and so AI can adopt it later.
    ProgramSchedule:
      type: object
      required: [mode, slots]
      properties:
        mode:
          type: string
          enum: [fixed, rotating]
        slots:
          type: array
          minItems: 2
          maxItems: 14
          items:
            type: ["integer", "null"]

    Program:
      type: object
      required: [id, userId, weekNumber, programName, splitType, programHighlights, days, aiGenerated, generatedAt]
      properties:
        id:           { type: integer }
        userId:       { type: string }
        weekNumber:   { type: integer }
        programName:  { type: string }
        splitType:    { type: string }
        programHighlights:
          type: array
          items:
            $ref: "#/components/schemas/ProgramHighlight"
        aiGenerated:  { type: boolean }
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
        generatedAt:  { type: string }
        longTermPhase:       { type: ["string", "null"], enum: [gain_weight, lose_weight, maintain, null] }
        shortTermPhase:      { type: ["string", "null"], enum: [calibration, calibration_review, bulk, maintenance, reverse_diet, diet, mini_cut, deload, null] }
        energyBalance:       { type: ["string", "null"], enum: [surplus, maintenance, deficit, high_deficit, null] }
        trainingWorkload:
          type: ["object", "null"]
          properties:
            daysTrained:     { type: integer }
            totalVolumeSets: { type: integer }
        longTermGoalWeight:  { type: ["number", "null"] }
        shortTermGoalWeight: { type: ["number", "null"] }
        dailyStepTarget:     { type: ["integer", "null"] }
        dailyCalorieTarget:  { type: ["integer", "null"] }
        weekInPhase:         { type: ["integer", "null"] }
        phaseTotalWeeks:     { type: ["integer", "null"] }
        cardioIntensity:
          type: ["object", "null"]
          properties:
            bpmMin: { type: integer }
            bpmMax: { type: integer }
            level:  { type: string, enum: [low, moderate, high] }
        startDate:           { type: ["string", "null"] }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/ProgramSchedule"
            - type: "null"

    ProgramStartDateUpdate:
      type: object
      required: [startDate]
      properties:
        startDate: { type: string, format: date }

    ManualProgramInput:
      type: object
      required: [programName, splitType, days]
      properties:
        programName:  { type: string, maxLength: 120 }
        splitType:    { type: string, maxLength: 80 }
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDay"
        # No `schedule`: a manually built program is never scheduled. Only AI
        # generation and the weekly check-in write one, so these routes have
        # nothing to accept and the column stays null on the manual lineage.

    ProgramFeedback:
      type: object
      required: [categories, note]
      properties:
        categories:
          type: array
          items:
            type: string
            enum:
              - training_days
              - exercises
              - sets
              - split
              - order
              - session_length
              - equipment
              - priority_muscles
              - overall_volume
        note: { type: string, maxLength: 1000 }

    GenerateProgramInput:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/ProgramFeedback"

    # ── Workouts ──────────────────────────────────────────────────────────────
    # Absurdity backstops again, sized so no real set is ever rejected: 0 weight is a
    # bodyweight movement, and the ceilings only exist to keep -100 kg x 500 reps out
    # of the volume/PR maths that reads these rows back.
    LoggedSet:
      type: object
      required: [setNumber, weight, completed]
      properties:
        setNumber: { type: integer, minimum: 1, maximum: 50 }
        weight:    { type: number, minimum: 0, maximum: 2000 }
        reps:      { type: ["integer", "null"], minimum: 0, maximum: 1000 }
        repsLeft:  { type: ["integer", "null"], minimum: 0, maximum: 1000 }
        repsRight: { type: ["integer", "null"], minimum: 0, maximum: 1000 }
        rpe:       { type: ["integer", "null"], minimum: 1, maximum: 10 }
        completed: { type: boolean }
        isNewPr:   { type: ["boolean", "null"] }

    LoggedExercise:
      type: object
      required: [name, muscle, sets]
      properties:
        name:   { type: string, maxLength: 80 }
        muscle: { type: string }
        sets:
          type: array
          items:
            $ref: "#/components/schemas/LoggedSet"
        # The log page has always sent this and three consumers read it back
        # (calendar.tsx, log.tsx's "last time" hint, and checkinData.ts's AI
        # prompt) - but it was missing here, so zod's default strip silently
        # dropped it before insert and every one of those reads found nothing.
        notes:  { type: ["string", "null"], maxLength: 2000 }
        # A logged checklist item: no weight, no reps, just how many of its rounds
        # were ticked. Kept out of `sets` on purpose - a fake set would land in the
        # volume and PR maths.
        kind:            { type: string, enum: [lift, checklist], default: lift }
        completedRounds: { type: ["integer", "null"], minimum: 0, maximum: 50 }
        # Both copied from the program row so history renders "🤸 Mobility · 2:30"
        # without looking the program up - and still reads correctly after the
        # program is edited, which is the point of snapshotting them here.
        targetSeconds:   { type: ["integer", "null"], minimum: 0, maximum: 86400 }
        category:        { type: ["string", "null"], enum: [stretch, mobility, core, breathing, other, null] }

    WorkoutLog:
      type: object
      required: [id, userId, date, dayNumber, weekNumber, exercisesLogged, createdAt, mode, loggingMode]
      properties:
        id:               { type: integer }
        userId:           { type: string }
        date:             { type: string }
        dayNumber:        { type: integer }
        weekNumber:       { type: integer }
        dayLabel:         { type: ["string", "null"] }
        mode:             { type: string, enum: [ai, independent], description: "Training mode the user was in when this session was logged" }
        loggingMode:      { type: string, enum: [full, calibration], description: "calibration = a calibration-phase session: sets are ticked off with no weight or reps" }
        calibrationFeedback:
          oneOf:
            - $ref: "#/components/schemas/CalibrationSessionFeedback"
            - type: "null"
        exercisesLogged:
          type: array
          items:
            $ref: "#/components/schemas/LoggedExercise"
        notes:            { type: ["string", "null"] }
        startedAt:        { type: ["string", "null"], description: "When the session clock started (the log page opening). Null for sessions logged before timing existed." }
        durationSeconds:  { type: ["integer", "null"], description: "Wall-clock session length. Stored as recorded even when implausible - eligibility for averaging is decided at read time." }
        createdAt:        { type: string }

    WorkoutLogInput:
      type: object
      required: [date, dayNumber, weekNumber, exercisesLogged]
      properties:
        date:             { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        dayNumber:        { type: integer }
        weekNumber:       { type: integer }
        dayLabel:         { type: ["string", "null"], maxLength: 60 }
        exercisesLogged:
          type: array
          items:
            $ref: "#/components/schemas/LoggedExercise"
        notes:            { type: ["string", "null"], maxLength: 2000 }
        # Only accepted while the current AI-lineage program is a calibration
        # week - otherwise rejected with 400 rather than silently downgraded.
        loggingMode:      { type: string, enum: [full, calibration], default: full }
        # The questions after a calibration session. Only accepted with
        # loggingMode calibration (400 otherwise). Null = finished without answering.
        calibrationFeedback:
          oneOf:
            - $ref: "#/components/schemas/CalibrationSessionFeedback"
            - type: "null"
        startedAt:        { type: ["string", "null"], format: date-time }
        durationSeconds:  { type: ["integer", "null"], minimum: 0, maximum: 86400 }

    SessionDurationStat:
      type: object
      required: [dayLabel, dayNumber, averageSeconds, sampleCount]
      properties:
        dayLabel:       { type: ["string", "null"] }
        dayNumber:      { type: integer }
        averageSeconds: { type: integer }
        sampleCount:    { type: integer, description: "How many eligible sessions the average is drawn from." }

    SessionDurationStats:
      type: object
      required: [stats]
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/SessionDurationStat"

    WorkoutStats:
      type: object
      required: [currentWeek, totalLogged, lastSessionDate, streakDays]
      properties:
        currentWeek:     { type: integer }
        totalLogged:     { type: integer }
        lastSessionDate: { type: ["string", "null"] }
        streakDays:      { type: integer }

    # ── Check-ins ─────────────────────────────────────────────────────────────
    Checkin:
      type: object
      required: [id, userId, weekNumber, energy, sleep, soreness, submittedAt]
      properties:
        id:              { type: integer }
        userId:          { type: string }
        weekNumber:      { type: integer }
        energy:          { type: integer }
        sleep:           { type: integer }
        soreness:        { type: string }
        # Legacy self-report, no longer collected - see sessionsLogged/sessionsPlanned.
        completion:      { type: ["string", "null"] }
        sessionsPlanned: { type: ["integer", "null"] }
        sessionsLogged:  { type: ["integer", "null"] }
        missedSessionReason: { type: ["string", "null"] }
        # Null means the legacy 1-10 energy/sleep scale; new rows are 5.
        ratingScaleMax:  { type: ["integer", "null"] }
        hungerAppetite:  { type: ["integer", "null"] }
        offDayDeviation: { type: ["boolean", "null"] }
        exerciseIssues:  { type: ["string", "null"] }
        wentWell:        { type: ["string", "null"] }
        didntGoWell:     { type: ["string", "null"] }
        sleepDecline:    { type: ["string", "null"] }
        digestionIssues: { type: ["string", "null"] }
        notes:           { type: ["string", "null"] }
        submittedAt:     { type: string }

    CheckinInput:
      type: object
      # weekNumber and completion are deliberately absent: the server derives the
      # training week from the profile and session adherence from workout_logs.
      required: [energy, sleep, soreness, hungerAppetite, offDayDeviation]
      properties:
        energy:          { type: integer, minimum: 1, maximum: 5 }
        sleep:           { type: integer, minimum: 1, maximum: 5 }
        soreness:        { type: string }
        hungerAppetite:  { type: integer, minimum: 1, maximum: 5 }
        offDayDeviation: { type: boolean }
        missedSessionReason:
          type: ["string", "null"]
          enum: [forgot_to_log, time, fatigue, injury, other, null]
        exerciseIssues:  { type: ["string", "null"] }
        wentWell:        { type: ["string", "null"] }
        didntGoWell:     { type: ["string", "null"] }
        sleepDecline:    { type: ["string", "null"] }
        digestionIssues: { type: ["string", "null"] }
        notes:           { type: ["string", "null"] }

    AdherenceDay:
      type: object
      required: [dayNumber, label, date]
      properties:
        dayNumber: { type: integer }
        label:     { type: string }
        date:      { type: ["string", "null"] }

    SessionAdherence:
      type: object
      required: [windowStart, windowEnd, plannedSessions, loggedSessions, loggedDays, missingDays, extraSessions]
      properties:
        windowStart:     { type: string }
        windowEnd:       { type: string }
        plannedSessions: { type: integer }
        loggedSessions:  { type: integer }
        loggedDays:
          type: array
          items:
            $ref: "#/components/schemas/AdherenceDay"
        missingDays:
          type: array
          items:
            $ref: "#/components/schemas/AdherenceDay"
        extraSessions:   { type: integer }

    CheckinResult:
      type: object
      required: [checkin, aiMessage, updatedProgram]
      properties:
        checkin:
          $ref: "#/components/schemas/Checkin"
        aiMessage:      { type: string }
        updatedProgram:
          $ref: "#/components/schemas/Program"

    # ── Async AI jobs ────────────────────────────────────────────────────────
    # Poll every few seconds until status is succeeded or failed. A job left
    # unfinished past the server's time limit is reported as failed, so polling
    # always ends. `result` is exactly what the blocking endpoint returns.
    AiJobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }

    AiJobStatus:
      type: string
      enum: [pending, running, succeeded, failed]

    ProgramGenerationJob:
      type: object
      required: [jobId, status, result, error, createdAt, completedAt]
      properties:
        jobId:       { type: string }
        status:      { $ref: "#/components/schemas/AiJobStatus" }
        result:
          oneOf:
            - $ref: "#/components/schemas/Program"
            - type: "null"
        error:       { type: ["string", "null"], description: "User-facing message; set only when status is failed." }
        createdAt:   { type: string }
        completedAt: { type: ["string", "null"] }

    CheckinJob:
      type: object
      required: [jobId, status, result, error, createdAt, completedAt]
      properties:
        jobId:       { type: string }
        status:      { $ref: "#/components/schemas/AiJobStatus" }
        result:
          oneOf:
            - $ref: "#/components/schemas/CheckinResult"
            - type: "null"
        error:       { type: ["string", "null"], description: "User-facing message; set only when status is failed." }
        createdAt:   { type: string }
        completedAt: { type: ["string", "null"] }

    # ── Calibration review ───────────────────────────────────────────────────
    CalibrationSessionFeedback:
      type: object
      description: Answered on the finish screen of every calibration session.
      required: [equipment, formConfidence, pain, overallFeel]
      properties:
        equipment:      { type: string, enum: ["yes", some_missing, "no"], description: "Did you find and use the machines/equipment?" }
        formConfidence: { type: integer, minimum: 1, maximum: 5, description: "How confident are you in your form today?" }
        pain:           { type: string, enum: [none, discomfort, pain] }
        painWhere:      { type: ["string", "null"], maxLength: 200, description: "Where it hurt - only meaningful when pain isn't none." }
        overallFeel:    { type: integer, minimum: 1, maximum: 5, description: "How did the session feel overall?" }

    CalibrationReviewInput:
      type: object
      description: >
        The review form. The per-session feedback is already known, so the form
        shows its summary (GET /calibration/status) and asks what has changed.
        When illOrInjured is true the rest may be left out - calibration pauses
        and nothing else is evaluated. Otherwise both nutrition answers are required.
      required: [illOrInjured]
      properties:
        illOrInjured:          { type: boolean, description: "Are you ill, or injured to the point where you can't train?" }
        nutritionSustainable:  { type: ["integer", "null"], minimum: 1, maximum: 5, description: "How sustainable does the nutrition plan feel long term?" }
        nutritionFitsSchedule: { type: ["string", "null"], enum: ["yes", mostly, "no", null], description: "Does it fit your schedule?" }
        anythingChanged:       { type: ["string", "null"], maxLength: 2000, description: "Has anything changed since your sessions? (shown under the session summary)" }
        notes:                 { type: ["string", "null"], maxLength: 2000, description: "Anything else your coach should know?" }

    CalibrationCheckRotation:
      type: object
      required: [met, logged, planned, missingDays]
      properties:
        met:         { type: boolean }
        logged:      { type: integer }
        planned:     { type: integer }
        missingDays: { type: array, items: { type: string }, description: "Labels of program days not logged in the window." }

    CalibrationCheckCount:
      type: object
      required: [met, count, required]
      properties:
        met:      { type: boolean }
        count:    { type: integer }
        required: { type: integer }

    CalibrationChecks:
      type: object
      description: The hard checks, computed by the server over the 7 days ending today. Any one not met forces the verdict to extend.
      required: [allMet, windowStart, windowEnd, fullRotation, weighIns, nutritionLogs]
      properties:
        allMet:        { type: boolean }
        windowStart:   { type: string }
        windowEnd:     { type: string }
        fullRotation:  { $ref: "#/components/schemas/CalibrationCheckRotation" }
        weighIns:      { $ref: "#/components/schemas/CalibrationCheckCount" }
        nutritionLogs: { $ref: "#/components/schemas/CalibrationCheckCount" }

    CalibrationExerciseNote:
      type: object
      required: [exercise, note]
      properties:
        exercise: { type: string }
        note:     { type: string }

    CalibrationSession:
      type: object
      required: [workoutLogId, date, dayNumber, dayLabel, note, exerciseNotes, feedback]
      properties:
        workoutLogId:  { type: integer }
        date:          { type: string }
        dayNumber:     { type: integer }
        dayLabel:      { type: ["string", "null"] }
        note:          { type: ["string", "null"] }
        exerciseNotes:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationExerciseNote"
        feedback:
          oneOf:
            - $ref: "#/components/schemas/CalibrationSessionFeedback"
            - type: "null"

    CalibrationPainReport:
      type: object
      required: [date, dayLabel, pain, where]
      properties:
        date:     { type: string }
        dayLabel: { type: ["string", "null"] }
        pain:     { type: string, enum: [discomfort, pain] }
        where:    { type: ["string", "null"] }

    CalibrationEquipmentCounts:
      type: object
      required: ["yes", some_missing, "no"]
      properties:
        "yes":        { type: integer }
        some_missing: { type: integer }
        "no":         { type: integer }

    CalibrationFeedbackSummary:
      type: object
      description: The per-session answers rolled up - what the review form shows before asking "anything changed?".
      required: [sessionsLogged, sessionsWithFeedback, averageFormConfidence, averageOverallFeel, equipment, painReports]
      properties:
        sessionsLogged:        { type: integer }
        sessionsWithFeedback:  { type: integer }
        averageFormConfidence: { type: ["number", "null"] }
        averageOverallFeel:    { type: ["number", "null"] }
        equipment:             { $ref: "#/components/schemas/CalibrationEquipmentCounts" }
        painReports:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationPainReport"

    CalibrationExerciseSwap:
      type: object
      required: [dayNumber, dayLabel, replaced, replacement, why]
      properties:
        dayNumber:   { type: integer }
        dayLabel:    { type: ["string", "null"] }
        replaced:    { type: string }
        replacement: { $ref: "#/components/schemas/Exercise" }
        why:         { type: string }

    CalibrationReview:
      type: object
      required: [id, programId, kind, calibrationDay, illOrInjured, nutritionSustainable, nutritionFitsSchedule, anythingChanged, notes, checks, verdict, reasons, workOn, exerciseSwaps, messageToUser, nextProgramId, resumedAt, submittedAt]
      properties:
        id:                    { type: integer }
        programId:             { type: integer }
        kind:                  { type: string, enum: [review, auto_exit] }
        calibrationDay:        { type: integer }
        illOrInjured:          { type: ["boolean", "null"] }
        nutritionSustainable:  { type: ["integer", "null"] }
        nutritionFitsSchedule: { type: ["string", "null"] }
        anythingChanged:       { type: ["string", "null"] }
        notes:                 { type: ["string", "null"] }
        checks:                { $ref: "#/components/schemas/CalibrationChecks" }
        verdict:               { type: string, enum: [pass, pass_with_notes, extend, paused] }
        reasons:               { type: array, items: { type: string } }
        workOn:                { type: array, items: { type: string }, description: "What to keep working on - in the next phase after a pass, or before retaking after extend." }
        exerciseSwaps:
          type: array
          description: Swaps applied to the next phase's program (empty unless calibration ended).
          items:
            $ref: "#/components/schemas/CalibrationExerciseSwap"
        messageToUser:         { type: string }
        nextProgramId:         { type: ["integer", "null"] }
        resumedAt:             { type: ["string", "null"], description: "Set on a paused review once the client said they've recovered." }
        submittedAt:           { type: string }

    CalibrationReviewResult:
      type: object
      required: [review, updatedProgram]
      properties:
        review:
          $ref: "#/components/schemas/CalibrationReview"
        updatedProgram:
          description: The next phase's program when calibration ended, otherwise null.
          oneOf:
            - $ref: "#/components/schemas/Program"
            - type: "null"

    CalibrationJob:
      type: object
      required: [jobId, status, result, error, createdAt, completedAt]
      properties:
        jobId:       { type: string }
        status:      { $ref: "#/components/schemas/AiJobStatus" }
        result:
          oneOf:
            - $ref: "#/components/schemas/CalibrationReviewResult"
            - type: "null"
        error:       { type: ["string", "null"], description: "User-facing message; set only when status is failed." }
        createdAt:   { type: string }
        completedAt: { type: ["string", "null"] }

    CalibrationStatus:
      type: object
      required: [inCalibration, calibrationDay, startDate, reviewOpensOn, lastReviewDate, autoExitOn, reviewOpen, reviewBlockedReason, nextReviewAvailableOn, paused, autoExitDue, checks, sessions, feedbackSummary, latestReview]
      properties:
        inCalibration:  { type: boolean }
        calibrationDay: { type: ["integer", "null"], description: "Day 1 = start date. 0 or less before the start date." }
        startDate:      { type: ["string", "null"] }
        reviewOpensOn:  { type: ["string", "null"], description: "Day 8." }
        lastReviewDate: { type: ["string", "null"], description: "Day 21, or later after a pause (7 days after recovering at the earliest)." }
        autoExitOn:     { type: ["string", "null"], description: "The day after lastReviewDate." }
        reviewOpen:     { type: boolean }
        reviewBlockedReason:
          type: ["string", "null"]
          enum: [not_in_calibration, not_ai_mode, too_early, paused, retake_tomorrow, ended, null]
        nextReviewAvailableOn: { type: ["string", "null"], description: "When the review opens again (too_early, or retake_tomorrow after an extend)." }
        paused:         { type: boolean }
        autoExitDue:    { type: boolean, description: "Past the last review day and not paused - the client should call POST /calibration/exit(/jobs)." }
        checks:
          oneOf:
            - $ref: "#/components/schemas/CalibrationChecks"
            - type: "null"
        sessions:
          type: array
          description: Calibration sessions logged since day 1, oldest first.
          items:
            $ref: "#/components/schemas/CalibrationSession"
        feedbackSummary:
          oneOf:
            - $ref: "#/components/schemas/CalibrationFeedbackSummary"
            - type: "null"
        latestReview:
          oneOf:
            - $ref: "#/components/schemas/CalibrationReview"
            - type: "null"

    # ── Progress ──────────────────────────────────────────────────────────────
    VolumePoint:
      type: object
      required: [week, totalSets]
      properties:
        week:       { type: integer }
        totalSets:  { type: integer }
        totalReps:  { type: integer }

    StrengthPoint:
      type: object
      required: [date, maxWeight]
      properties:
        date:       { type: string }
        maxWeight:  { type: number }
        exercise:   { type: string }

    PersonalRecord:
      type: object
      required: [exercise, maxWeight, date]
      properties:
        exercise:   { type: string }
        maxWeight:  { type: number }
        reps:       { type: ["integer", "null"] }
        date:       { type: string }

    MuscleVolumeWeek:
      type: object
      required: [week]
      properties:
        week:        { type: integer }
        chest:       { type: integer }
        shoulders:   { type: integer }
        biceps:      { type: integer }
        triceps:     { type: integer }
        upperBack:   { type: integer }
        lats:        { type: integer }
        quads:       { type: integer }
        hamstrings:  { type: integer }
        glutes:      { type: integer }
        calves:      { type: integer }
        core:        { type: integer }

    BodyweightPoint:
      type: object
      required: [date, weight]
      properties:
        date:       { type: string }
        weight:     { type: number }

    # ── Bodyweight ────────────────────────────────────────────────────────────
    BodyweightLog:
      type: object
      required: [id, userId, date, weight, weightUnit, createdAt]
      properties:
        id:         { type: integer }
        userId:     { type: string }
        date:       { type: string }
        weight:     { type: number }
        weightUnit: { type: string }
        createdAt:  { type: string }
        updatedAt:  { type: string }

    BodyweightLogInput:
      type: object
      required: [date, weight]
      properties:
        date:       { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        weight:     { type: number, minimum: 20, maximum: 1000 }

    # ── Daily logs (calories / steps / cardio) ─────────────────────────────────
    DailyLog:
      type: object
      required: [id, userId, date, createdAt]
      properties:
        id:            { type: integer }
        userId:        { type: string }
        date:          { type: string }
        calories:      { type: ["integer", "null"] }
        steps:         { type: ["integer", "null"] }
        cardioType:    { type: ["string", "null"] }
        cardioMinutes: { type: ["integer", "null"] }
        createdAt:     { type: string }
        updatedAt:     { type: string }

    DailyCheckinInput:
      type: object
      required: [date]
      properties:
        date:          { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        weight:        { type: ["number", "null"], minimum: 20, maximum: 1000 }
        calories:      { type: ["integer", "null"], minimum: 0, maximum: 20000 }
        steps:         { type: ["integer", "null"], minimum: 0, maximum: 200000 }
        cardioType:    { type: ["string", "null"], maxLength: 60 }
        cardioMinutes: { type: ["integer", "null"], minimum: 0, maximum: 1440 }

    DailyCheckinResult:
      type: object
      required: [dailyLog]
      properties:
        dailyLog:
          $ref: "#/components/schemas/DailyLog"
        bodyweightLog:
          oneOf:
            - $ref: "#/components/schemas/BodyweightLog"
            - type: "null"

    DailyLogWeekEntry:
      type: object
      required: [date]
      properties:
        date:          { type: string }
        calories:      { type: ["integer", "null"] }
        steps:         { type: ["integer", "null"] }
        cardioType:    { type: ["string", "null"] }
        cardioMinutes: { type: ["integer", "null"] }
        weight:        { type: ["number", "null"] }
        weightUnit:    { type: ["string", "null"] }

    DailyLogsWeekResult:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyLogWeekEntry"
        shortTermPhase: { type: ["string", "null"], enum: [calibration, calibration_review, bulk, maintenance, reverse_diet, diet, mini_cut, deload, null] }

    GoalProgress:
      type: object
      required: [startWeight, startDate, currentTrendWeight]
      properties:
        startWeight:        { type: number }
        startDate:          { type: string }
        currentTrendWeight: { type: number }
        goalWeight:         { type: ["number", "null"] }
        percentToGoal:      { type: ["number", "null"] }
        targetDate:         { type: ["string", "null"] }

    # ── Calendar colours ──────────────────────────────────────────────────────
    CalendarColor:
      type: object
      required: [id, userId, dayLabel, hexColor]
      properties:
        id:         { type: integer }
        userId:     { type: string }
        dayLabel:   { type: string }
        hexColor:   { type: string }

    CalendarColorInput:
      type: object
      required: [dayLabel, hexColor]
      properties:
        dayLabel:   { type: string, maxLength: 64 }
        hexColor:   { type: string, pattern: "^#[0-9a-fA-F]{6}$" }

    # ── Subscriptions ─────────────────────────────────────────────────────────
    Subscription:
      type: object
      required: [plan, status]
      properties:
        userId:                 { type: string }
        plan:                   { type: string }
        status:                 { type: string }
        stripeCustomerId:       { type: ["string", "null"] }
        stripeSubscriptionId:   { type: ["string", "null"] }
        currentPeriodEnd:       { type: ["string", "null"] }

    CheckoutInput:
      type: object
      required: [plan, successUrl, cancelUrl]
      properties:
        plan:       { type: string }
        successUrl: { type: string }
        cancelUrl:  { type: string }

    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }

    PortalSession:
      type: object
      required: [url]
      properties:
        url: { type: string }
